[project]
name = "helpdesk-ai-agent"
version = "0.1.0"
description = "Hybrid SQL + Vector AI Help Desk Agent built with LangGraph and Gemini"
readme = "README.md"
requires-python = ">=3.11"

dependencies = [
    "langchain>=0.3",
    "langgraph>=1.0",
    "langchain-google-genai>=2.0",
    "langchain-text-splitters>=0.3",
    "langchain-chroma>=0.1",
    "langchain-huggingface>=0.1",
    "sentence-transformers>=3.0",
    "chromadb>=0.5",
    "python-dotenv>=1.0",
    "pydantic>=2.0",
    "sqlalchemy>=2.0",
    "pandas>=2.0",
    "fastapi[standard]",
    "langgraph-checkpoint-postgres>=3.1,<4",
    "psycopg[binary,pool]>=3.2",

]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]
exclude = ["data*", "tests*"]

[project.optional-dependencies]
test = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "httpx",

]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
markers = [
    "integration: tests that use real databases or external services",
]

[tool.coverage.run]
source = ["app"]

[tool.coverage.report]
show_missing = true
fail_under = 50
