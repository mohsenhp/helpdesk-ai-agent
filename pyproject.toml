[project]
name = "helpdesk-ai-agent"
version = "0.1.0"
description = "Hybrid SQL + Vector AI Help Desk Agent built with LangGraph and Gemini"
readme = "README.md"
requires-python = ">=3.11"

dependencies = [
    "langchain>=0.3",
    "langgraph>=1.0",
    "langchain-google-genai>=2.0",
    "langchain-text-splitters>=0.3",
    "langchain-chroma>=0.1",
    "langchain-huggingface>=0.1",
    "sentence-transformers>=3.0",
    "chromadb>=0.5",
    "python-dotenv>=1.0",
    "pydantic>=2.0",
    "sqlalchemy>=2.0",
    "pandas>=2.0",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]
exclude = ["data*", "tests*"]
