<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>HelpDesk AI Agent</title>

    <link rel="stylesheet" href="/style.css">
</head>

<body>

<div class="chat-container">

    <header>
        <h1>🤖 HelpDesk AI Assistant</h1>
        <p>
            Ask me about tickets, incidents, and knowledge base articles.
        </p>
    </header>


    <main id="chat"></main>


    <footer>

    <button
        id="new-chat-button"
        class="new-chat"
    >
        + New Chat
    </button>


    <input
        id="question"
        type="text"
        placeholder="Ask a helpdesk question..."
    >


    <button id="send-button">
        Send
    </button>

</footer>

    <div class="suggestions">

    <button>
        How many open critical VPN tickets are there?
    </button>

    <button>
        How do I troubleshoot VPN after a Windows update?
    </button>

    <button>
        Show recent authentication incidents
    </button>

</div>

</div>


<script src="/app.js"></script>

</body>

</html>
