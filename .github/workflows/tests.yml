name: Tests

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tests:
    name: Python tests
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip

      - name: Install dependencies
        run: python -m pip install -e ".[test]"

      - name: Build vector database
        run: |
          python -m app.vector.loader

      - name: Run tests
        env:
          GOOGLE_API_KEY: test-api-key
          GEMINI_MODEL: test-model
          EMBEDDING_MODEL: sentence-transformers/all-MiniLM-L6-v2
          CHECKPOINT_DATABASE_URL: ""
          LANGGRAPH_STRICT_MSGPACK: "true"
        run: >
          pytest
          --cov=app
          --cov-report=term-missing

  docker-smoke-test:
    name: Docker smoke test
    runs-on: ubuntu-latest
    needs: tests
    timeout-minutes: 25

    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Create CI environment file
        run: |
          cat > .env <<'EOF'
          GOOGLE_API_KEY=test-api-key
          GEMINI_MODEL=test-model
          EMBEDDING_MODEL=sentence-transformers/all-MiniLM-L6-v2
          CHECKPOINT_DATABASE_URL=
          LANGGRAPH_STRICT_MSGPACK=true
          EOF

      - name: Build and start containers
        run: docker compose up --build --detach

      - name: Wait for API health check
        shell: bash
        run: |
          echo "Waiting for the HelpDesk API..."

          for attempt in {1..120}; do
            if curl \
              --fail \
              --silent \
              --show-error \
              http://localhost:8000/health \
              > health-response.json; then
              echo "API is healthy."
              cat health-response.json
              exit 0
            fi

            echo "Attempt ${attempt}/120: API is not ready yet."
            sleep 5
          done

          echo "API did not become healthy within 10 minutes."
          exit 1

      - name: Verify health response
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          response = json.loads(
              Path("health-response.json").read_text(
                  encoding="utf-8",
              )
          )

          assert response == {"status": "ok"}, response
          print("Health response is valid.")
          PY

      - name: Show container status
        if: always()
        run: docker compose ps

      - name: Show container logs
        if: always()
        run: docker compose logs --no-color

      - name: Stop containers
        if: always()
        run: docker compose down --volumes --remove-orphans
