name: Build and Deploy to Azure

on:
  workflow_run:
    workflows:
      - Tests
    types:
      - completed
    branches:
      - main

  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: azure-container-app-deployment
  cancel-in-progress: false

env:
  IMAGE_NAME: helpdesk-ai-agent
  IMAGE_TAG: ${{ github.event.workflow_run.head_sha }}

jobs:
  build-and-deploy:
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    name: Build and deploy
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v5
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - name: Login to Azure
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Login to Azure Container Registry
        run: |
          set -euo pipefail

          az acr login --name ${{ secrets.ACR_NAME }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker image
        run: |
          set -euo pipefail

          docker build \
            -t ${{ secrets.ACR_LOGIN_SERVER }}/${{ env.IMAGE_NAME }}:${{ env.IMAGE_TAG }} \
            -t ${{ secrets.ACR_LOGIN_SERVER }}/${{ env.IMAGE_NAME }}:latest \
            .

      - name: Push Docker images
        run: |
          set -euo pipefail

          docker push \
            ${{ secrets.ACR_LOGIN_SERVER }}/${{ env.IMAGE_NAME }}:${{ env.IMAGE_TAG }}

          docker push \
            ${{ secrets.ACR_LOGIN_SERVER }}/${{ env.IMAGE_NAME }}:latest

      - name: Get current revision
        id: current_revision
        shell: bash
        run: |
          set -euo pipefail

          CURRENT_REVISION=$(az containerapp revision list \
            --name ${{ secrets.CONTAINER_APP_NAME }} \
            --resource-group ${{ secrets.RESOURCE_GROUP }} \
            --query "[?trafficWeight==\`100\`].name | [0]" \
            -o tsv)

          if [[ -z "$CURRENT_REVISION" ]]; then
            echo "No active revision found."
            echo "current_revision=" >> $GITHUB_OUTPUT
          else
            echo "Current revision: ${CURRENT_REVISION}"
            echo "current_revision=${CURRENT_REVISION}" >> $GITHUB_OUTPUT
            echo "old_revision=${CURRENT_REVISION}" >> $GITHUB_OUTPUT
          fi

      - name: Deploy Container App
        run: |
          az containerapp update \
            --name ${{ secrets.CONTAINER_APP_NAME }} \
            --resource-group ${{ secrets.RESOURCE_GROUP }} \
            --image ${{ secrets.ACR_LOGIN_SERVER }}/${{ env.IMAGE_NAME }}:${{ env.IMAGE_TAG }}
            --set-env-vars \
            AZURE_SEARCH_ENDPOINT=${{ secrets.AZURE_SEARCH_ENDPOINT }} \
            AZURE_SEARCH_API_KEY=${{ secrets.AZURE_SEARCH_API_KEY }} \
            AZURE_SEARCH_INDEX=${{ secrets.AZURE_SEARCH_INDEX }}

      - name: Detect new revision
        id: new_revision
        shell: bash
        run: |
          set -euo pipefail

          echo "Waiting for Azure to create a new revision..."

          OLD_REVISION="${{ steps.current_revision.outputs.current_revision }}"

          for attempt in {1..60}; do

            NEW_REVISION=$(az containerapp revision list \
              --name ${{ secrets.CONTAINER_APP_NAME }} \
              --resource-group ${{ secrets.RESOURCE_GROUP }} \
              --query "sort_by(@,&properties.createdTime)[-1].name" \
              -o tsv)

            echo "Current newest revision: ${NEW_REVISION}"

            if [[ -n "${NEW_REVISION}" && "${NEW_REVISION}" != "${OLD_REVISION}" ]]; then
              echo "New revision detected: ${NEW_REVISION}"
              echo "revision=${NEW_REVISION}" >> $GITHUB_OUTPUT
              exit 0
            fi

            sleep 5

          done

          echo "Timed out waiting for a new revision."

          exit 1

      - name: Wait until revision is healthy
        shell: bash
        run: |
          set -euo pipefail

          REVISION="${{ steps.new_revision.outputs.revision }}"

          echo "Waiting for revision ${REVISION}"

          for attempt in {1..60}; do

            REVISION_INFO=$(az containerapp revision show \
              --name ${{ secrets.CONTAINER_APP_NAME }} \
              --resource-group ${{ secrets.RESOURCE_GROUP }} \
              --revision "${REVISION}")

            HEALTH=$(echo "$REVISION_INFO" | jq -r '.properties.healthState')

            RUNNING=$(echo "$REVISION_INFO" | jq -r '.properties.runningState')

            echo "Attempt ${attempt}"
            echo "Running: ${RUNNING}"
            echo "Health : ${HEALTH}"

            if [[ "${RUNNING}" == "Running" && "${HEALTH}" == "Healthy" ]]; then
              echo "Revision is healthy."

              echo "## Deployment successful 🚀" >> $GITHUB_STEP_SUMMARY
              echo "" >> $GITHUB_STEP_SUMMARY
              echo "Revision: ${REVISION}" >> $GITHUB_STEP_SUMMARY
              echo "Image: ${{ secrets.ACR_LOGIN_SERVER }}/${{ env.IMAGE_NAME }}:${{ env.IMAGE_TAG }}" >> $GITHUB_STEP_SUMMARY

              exit 0
            fi

            sleep 10

          done

          echo "Deployment failed."

          echo "Collecting failure diagnostics..."

          FINAL_REVISION_INFO=$(az containerapp revision show \
            --name ${{ secrets.CONTAINER_APP_NAME }} \
            --resource-group ${{ secrets.RESOURCE_GROUP }} \
            --revision "${REVISION}")

          FINAL_HEALTH=$(echo "$FINAL_REVISION_INFO" | jq -r '.properties.healthState')

          FINAL_RUNNING=$(echo "$FINAL_REVISION_INFO" | jq -r '.properties.runningState')

          exit 1

      - name: Smoke test FastAPI application
        shell: bash
        run: |
          set -euo pipefail
          
          HEALTH_URL="https://helpdesk-ai-agent.kindmoss-7afefc50.northeurope.azurecontainerapps.io/health"
          
          echo "Running FastAPI smoke test..."
          echo "Endpoint: ${HEALTH_URL}"
          
          for attempt in {1..10}; do
          
            RESPONSE=$(curl \
              --fail \
              --silent \
              --show-error \
              "${HEALTH_URL}" || true)
          
            echo "Attempt ${attempt}"
            echo "Response: ${RESPONSE}"
          
            if echo "${RESPONSE}" | jq -e '.status == "ok"' > /dev/null; then
              echo "FastAPI smoke test passed."
          
              echo "## Smoke test successful ✅" >> $GITHUB_STEP_SUMMARY
              echo "" >> $GITHUB_STEP_SUMMARY
              echo "Endpoint: ${HEALTH_URL}" >> $GITHUB_STEP_SUMMARY
          
              exit 0
            fi
          
            echo "Health endpoint not ready yet. Retrying..."
            sleep 10
          
          done
          
          echo "FastAPI smoke test failed."
          
          echo "## ❌ Smoke test failed" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "Endpoint: ${HEALTH_URL}" >> $GITHUB_STEP_SUMMARY
          
          exit 1

      - name: Rollback deployment
        if: failure()
        shell: bash
        run: |
          set -euo pipefail

          OLD_REVISION="${{ steps.current_revision.outputs.old_revision }}"

          if [[ -z "${OLD_REVISION}" ]]; then
            echo "No previous revision available. Cannot rollback."
            exit 1
          fi

          echo "Rolling traffic back to ${OLD_REVISION}"

          az containerapp ingress traffic set \
            --name ${{ secrets.CONTAINER_APP_NAME }} \
            --resource-group ${{ secrets.RESOURCE_GROUP }} \
            --revision-weight "${OLD_REVISION}=100"

          echo "Rollback completed."

          echo "## 🔄 Rollback completed" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "Restored revision: ${OLD_REVISION}" >> $GITHUB_STEP_SUMMARY
