services:
  postgres:
    image: postgres:16-alpine
    container_name: helpdesk-checkpoint-postgres

    environment:
      POSTGRES_USER: helpdesk
      POSTGRES_PASSWORD: helpdesk
      POSTGRES_DB: helpdesk_checkpoint

    volumes:
      - checkpoint-postgres-data:/var/lib/postgresql/data

    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U helpdesk -d helpdesk_checkpoint",
        ]
      interval: 5s
      timeout: 5s
      retries: 10

  helpdesk-agent:
    build:
      context: .
      dockerfile: Dockerfile

    container_name: helpdesk-ai-agent

    ports:
      - "8000:8000"

    env_file:
      - .env

    environment:
      CHECKPOINT_DATABASE_URL: >-
        postgresql://helpdesk:helpdesk@postgres:5432/helpdesk_checkpoint?sslmode=disable
      LANGGRAPH_STRICT_MSGPACK: "true"

    depends_on:
      postgres:
        condition: service_healthy

    volumes:
      - helpdesk-runtime:/app/runtime
      - huggingface-cache:/app/.cache/huggingface

    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')",
        ]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 180s

volumes:
  helpdesk-runtime:
  huggingface-cache:
  checkpoint-postgres-data:
